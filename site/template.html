<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (_) {}
  </script>
  <title>{{TITLE}} — ITGC 실무 가이드</title>
  <link rel="canonical" href="https://guide.propsol.co.kr/{{SLUG}}" />
  <meta name="description" content="{{TITLE}} — ISMS-P × ITGC 매핑 실무 가이드. 인증기준별 ITGC 영역 매핑과 IT감사 실무 포인트." />
  <meta property="og:title" content="{{TITLE}} — ITGC 실무 가이드" />
  <meta property="og:description" content="ISMS-P 인증기준별 ITGC 매핑과 감사 절차, 실무 Q&A" />
  <meta property="og:url" content="https://guide.propsol.co.kr/{{SLUG}}" />
  <meta property="og:type" content="article" />
  <meta name="robots" content="index, follow" />
  {{ARTICLE_SCHEMA}}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="/assets/article.css" />
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="logo" href="/">PROP<span>SOLUTION</span><span class="guide-mark">ITGC GUIDE</span></a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="/#guide-list">가이드</a>
        <a href="/matrix">전체 매트릭스</a>
        <a href="/meta/methodology">방법론</a>
        <a href="/meta/reading-order">읽는 순서</a>
      </nav>
      <button class="theme-button" id="theme-button" type="button" aria-label="다크 모드로 변경">☾</button>
    </div>
  </header>

  <main class="shell article-layout" id="main">
    <div class="article-body">
      <div class="meta-tags">
        <span class="domain-tag {{DOMAIN_CLASS}}">{{DOMAIN_TAG}}</span>
        <span class="classification">{{CLASSIFICATION}}</span>
      </div>
      <p class="article-author">작성자 <a href="https://propsol.co.kr/about/yjw" rel="author">양주웅 회계사(KICPA)</a> · 세움회계법인 이사</p>
      <article class="content">
{{CONTENT}}
      </article>
      <nav class="page-nav" aria-label="이전·다음 가이드">{{NAV_PREV}}{{NAV_NEXT}}</nav>
      <a class="github-link" href="https://github.com/yanghoeg/itgc-to-isms-p/blob/main/{{GITHUB_PATH}}" target="_blank" rel="noopener">GitHub에서 원문 보기 ↗</a>
    </div>
    <aside class="article-sidebar">{{TOC}}</aside>
  </main>

  <footer>
    <div class="shell footer-row">
      <span>© 2026 PROPSOLUTION Corp.</span>
      <div class="footer-links">
        <a href="https://propsol.co.kr">프로프솔루션</a>
        <a href="https://u-6.xyz">usix</a>
        <a href="/meta/methodology">방법론</a>
        <a href="https://github.com/yanghoeg/itgc-to-isms-p">GitHub</a>
      </div>
    </div>
  </footer>
  <script>
    const themeButton = document.getElementById('theme-button');
    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === 'dark';
      themeButton.textContent = dark ? '☀' : '☾';
      themeButton.setAttribute('aria-label', dark ? '라이트 모드로 변경' : '다크 모드로 변경');
    }
    themeButton.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (_) {}
      updateThemeButton();
    });
    updateThemeButton();
    const toc = document.querySelector('.toc');
    if (toc) {
      const desktop = matchMedia('(min-width: 901px)');
      const updateToc = () => { toc.open = desktop.matches; };
      updateToc();
      desktop.addEventListener('change', updateToc);
    }
  </script>
</body>
</html>
